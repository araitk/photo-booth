<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101113" />
    <title>Photo Booth</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20256%20256%22%3E%3Crect%20width%3D%22256%22%20height%3D%22256%22%20rx%3D%2255%22%20fill%3D%22%23222222%22%2F%3E%3Cpath%20fill%3D%22%23fafafa%22%20fill-rule%3D%22evenodd%22%20d%3D%22M90%2031H166Q178%2031%20178%2043V213Q178%20225%20166%20225H90Q78%20225%2078%20213V43Q78%2031%2090%2031Z%20M89%2044H167V92H89Z%20M89%20103H167V151H89Z%20M89%20162H167V210H89Z%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="booth">
      <header class="header">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path fill-rule="evenodd" d="M90 31H166Q178 31 178 43V213Q178 225 166 225H90Q78 225 78 213V43Q78 31 90 31Z M89 44H167V92H89Z M89 103H167V151H89Z M89 162H167V210H89Z"/></svg></span> Photo Booth</div>
        <div class="header-controls">
          <div class="camera-control">
            <label for="camera-select" data-i18n="カメラ">カメラ</label>
            <div class="select-wrap"><select id="camera-select" disabled><option value="" data-i18n="自動">自動</option></select><span aria-hidden="true">⌄</span></div>
          </div>
          <div class="resolution-control">
            <label for="resolution" data-i18n="解像度">解像度</label>
            <div class="select-wrap"><select id="resolution"><option value="auto" data-i18n="自動">自動</option><option value="720">HD · 720p</option><option value="1080" selected>Full HD · 1080p</option><option value="2160">4K · 2160p</option></select><span aria-hidden="true">⌄</span></div>
          </div>
          <div class="timer-control">
            <label for="timer" data-i18n="タイマー">タイマー</label>
            <div class="select-wrap"><select id="timer"><option value="0" data-i18n="なし">なし</option><option value="3" data-i18n="3秒">3秒</option><option value="5" data-i18n="5秒">5秒</option><option value="10" data-i18n="10秒">10秒</option></select><span aria-hidden="true">⌄</span></div>
          </div>
          <div class="language-control">
            <label for="language" data-i18n="言語">言語</label>
            <div class="select-wrap"><select id="language"><option value="en">English</option><option value="ja">日本語</option></select><span aria-hidden="true">⌄</span></div>
          </div>
          <button class="shortcut-help-button" id="show-shortcuts" type="button" aria-label="ショートカット一覧" data-i18n-aria-label="ショートカット一覧" aria-keyshortcuts="Shift+/" title="ショートカット一覧 (?)" data-i18n-title="ショートカット一覧 (?)">?</button>
        </div>
      </header>
      <p class="status-message" id="status" role="status" aria-live="polite"></p>

      <section class="studio" aria-label="カメラ" data-i18n-aria-label="カメラ">
        <div class="preview-space" id="preview-space">
          <div class="viewfinder" id="viewfinder">
            <div class="media-surface" id="media-surface">
              <video id="camera" autoplay muted playsinline aria-label="左右反転したカメラプレビュー" data-i18n-aria-label="左右反転したカメラプレビュー"></video>
              <button class="photo-review" id="photo-review" type="button" aria-label="カメラに戻る" data-i18n-aria-label="カメラに戻る" aria-keyshortcuts="Space Escape ArrowUp ArrowLeft ArrowRight" hidden><img id="captured-photo" alt="撮影した写真" data-i18n-alt="撮影した写真"></button>
          <div class="grid" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="countdown" id="countdown" role="status" aria-live="assertive" aria-atomic="true" hidden></div>
            <div class="preview-status">
              <span class="live-badge" id="live-badge" role="status" aria-live="polite"><span aria-hidden="true"></span> OFF</span>
              <span class="camera-details" id="actual-settings" hidden></span>
            </div>
            <div class="camera-placeholder" id="placeholder">
            <div class="camera-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M11 8l2-3h6l2 3h5a3 3 0 013 3v13a3 3 0 01-3 3H6a3 3 0 01-3-3V11a3 3 0 013-3h5z" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="17" r="6" stroke="currentColor" stroke-width="1.5"/></svg></div>
            <p id="camera-message" data-i18n="カメラの使用を許可すると映像が表示されます。">カメラの使用を許可すると映像が表示されます。</p>
            <button class="start-button" id="start-camera" type="button" data-i18n="カメラを開始">カメラを開始</button>
          </div>
            <button class="fullscreen-button" id="fullscreen" type="button" aria-label="フルスクリーン" data-i18n-aria-label="フルスクリーン" aria-pressed="false" aria-keyshortcuts="F" title="フルスクリーン (F)" data-i18n-title="フルスクリーン (F)"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div class="preview-controls" hidden>
              <div class="shooting-controls">
                <div></div>
                <button class="shutter" id="shutter" type="button" disabled aria-label="撮影" data-i18n-aria-label="撮影" aria-keyshortcuts="Space" title="撮影 (Space)" data-i18n-title="撮影 (Space)"><span></span></button>
                <div class="photo-actions" id="photo-actions" hidden>
                  <button id="download-photo" type="button" aria-label="写真をダウンロード" data-i18n-aria-label="写真をダウンロード" aria-keyshortcuts="S" title="写真をダウンロード (S)" data-i18n-title="写真をダウンロード (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></button>
                  <button id="delete-photo" type="button" aria-label="写真を削除" data-i18n-aria-label="写真を削除" title="写真を削除" data-i18n-title="写真を削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></button>
                </div>
              </div>
              <section class="gallery" aria-label="写真" data-i18n-aria-label="写真">
        <div class="gallery-heading"><h2><span class="gallery-title" data-i18n="写真">写真</span> <span id="photo-count">0</span><span id="photo-position" role="status" aria-live="polite" hidden></span></h2><button id="undo-delete" type="button" aria-label="削除した写真を元に戻す" data-i18n-aria-label="削除した写真を元に戻す" aria-keyshortcuts="Z Meta+z Control+z" title="削除した写真を元に戻す (Z)" data-i18n-title="削除した写真を元に戻す (Z)" hidden data-i18n="元に戻す">元に戻す</button></div>
        <div class="gallery-empty"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><path d="M3 17l6-6 4 4 3-3 5 5" stroke="currentColor" stroke-width="1.3"/></svg><p data-i18n="まだ写真がありません">まだ写真がありません</p></div>
        <div class="gallery-list" id="gallery-list" role="group" aria-label="写真一覧" data-i18n-aria-label="写真一覧" hidden></div>
        <span class="new-thumbnail-target" id="new-thumbnail-target" aria-hidden="true"></span>
      </section>
            </div>
            <div class="capture-flash" id="capture-flash" aria-hidden="true"></div>
          </div>
        </div>
      </section>
      <footer class="project-footer"><a href="https://github.com/araitk/photo-booth" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
    </main>
    <dialog class="shortcut-help" id="shortcut-help" aria-labelledby="shortcut-help-title">
      <div class="shortcut-help-heading"><h2 id="shortcut-help-title" data-i18n="ショートカット">ショートカット</h2><button id="close-shortcuts" type="button" aria-label="閉じる" data-i18n-aria-label="閉じる" autofocus>×</button></div>
      <dl>
        <div><dt><kbd>Enter</kbd></dt><dd data-i18n="カメラを開始">カメラを開始</dd></div>
        <div><dt><kbd>F</kbd></dt><dd data-i18n="全画面表示を切り替え">全画面表示を切り替え</dd></div>
        <div><dt><kbd>Space</kbd></dt><dd data-i18n="撮影／タイマーをキャンセル／プレビューを閉じる">撮影／タイマーをキャンセル／プレビューを閉じる</dd></div>
        <div><dt><kbd>←</kbd> <kbd>→</kbd></dt><dd data-i18n="プレビュー写真を切り替え">プレビュー写真を切り替え</dd></div>
        <div><dt><kbd>↓</kbd></dt><dd data-i18n="プレビューを開く">プレビューを開く</dd></div>
        <div><dt><kbd>↑</kbd></dt><dd data-i18n="プレビューを閉じる">プレビューを閉じる</dd></div>
        <div><dt><kbd>S</kbd></dt><dd data-i18n="選択中の写真を保存">選択中の写真を保存</dd></div>
        <div><dt><kbd>Delete</kbd></dt><dd data-i18n="選択中の写真を削除">選択中の写真を削除</dd></div>
        <div><dt><kbd>Z</kbd></dt><dd data-i18n="直前に削除した写真を元に戻す">直前に削除した写真を元に戻す</dd></div>
        <div><dt><kbd>?</kbd></dt><dd data-i18n="この一覧を表示／閉じる">この一覧を表示／閉じる</dd></div>
      </dl>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
