<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101113" />
    <title>Photo Booth</title>
  </head>
  <body>
    <main class="booth">
      <header class="header">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4.5" width="19" height="15" rx="4"/><circle cx="12" cy="12" r="4"/></svg></span> Photo Booth</div>
        <div class="header-controls">
          <div class="timer-control">
            <label for="timer">タイマー</label>
            <div class="select-wrap"><select id="timer" disabled><option value="0">なし</option><option value="3">3秒</option><option value="5">5秒</option><option value="10">10秒</option></select><span aria-hidden="true">⌄</span></div>
          </div>
          <div class="resolution-control">
            <label for="resolution">解像度</label>
            <div class="select-wrap"><select id="resolution" disabled><option value="auto">自動</option><option value="720">HD · 720p</option><option value="1080" selected>Full HD · 1080p</option><option value="2160">4K · 2160p</option></select><span aria-hidden="true">⌄</span></div>
          </div>
        </div>
      </header>
      <p class="status-message" id="status" role="status" aria-live="polite"></p>

      <section class="studio" aria-label="カメラ">
        <div class="preview-space" id="preview-space">
          <div class="viewfinder" id="viewfinder">
            <div class="media-surface" id="media-surface">
              <video id="camera" autoplay muted playsinline aria-label="左右反転したカメラプレビュー"></video>
              <button class="photo-review" id="photo-review" type="button" aria-label="カメラに戻る" hidden><img id="captured-photo" alt="撮影した写真"></button>
          <div class="grid" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="countdown" id="countdown" role="status" aria-live="assertive" aria-atomic="true" hidden></div>
            <div class="preview-status">
              <span class="live-badge" id="live-badge" role="status" aria-live="polite"><span aria-hidden="true"></span> OFF</span>
              <span class="camera-details" id="actual-settings" hidden></span>
            </div>
            <div class="camera-placeholder" id="placeholder">
            <div class="camera-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M11 8l2-3h6l2 3h5a3 3 0 013 3v13a3 3 0 01-3 3H6a3 3 0 01-3-3V11a3 3 0 013-3h5z" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="17" r="6" stroke="currentColor" stroke-width="1.5"/></svg></div>
            <p id="camera-message">カメラの使用を許可すると映像が表示されます。</p>
            <button class="start-button" id="start-camera" type="button">カメラを開始 <span aria-hidden="true">↗</span></button>
          </div>
            <button class="fullscreen-button" id="fullscreen" type="button" aria-label="フルスクリーン" aria-pressed="false" title="フルスクリーン"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div class="preview-controls">
              <div class="shooting-controls">
                <div></div>
                <button class="shutter" id="shutter" type="button" disabled aria-label="撮影" title="撮影"><span></span></button>
                <div class="photo-actions" id="photo-actions" hidden>
                  <button id="back-to-camera" type="button" aria-label="カメラに戻る" title="カメラに戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m10 5-7 7 7 7M3 12h18"/></svg></button>
                  <button id="download-photo" type="button" aria-label="PNGをダウンロード" title="PNGをダウンロード"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg></button>
                  <button id="delete-photo" type="button" aria-label="写真を削除" title="写真を削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></button>
                </div>
              </div>
              <section class="gallery" aria-label="撮影した写真">
        <div class="gallery-heading"><h2>撮影した写真 <span id="photo-count">0</span></h2></div>
        <div class="gallery-empty"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><path d="M3 17l6-6 4 4 3-3 5 5" stroke="currentColor" stroke-width="1.3"/></svg><p>撮影した写真がここに並びます</p></div>
        <div class="gallery-list" id="gallery-list" role="group" aria-label="写真一覧" hidden></div>
        <span class="new-thumbnail-target" id="new-thumbnail-target" aria-hidden="true"></span>
      </section>
            </div>
            <div class="capture-flash" id="capture-flash" aria-hidden="true"></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
